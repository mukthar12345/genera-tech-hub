
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0A1628">
  <title>Login / Sign Up — Genera Tech Hub</title>
  <meta name="description" content="Access your Genera Tech Hub account.">

  <link rel="icon" href="public/images/favicon.ico">
  <link rel="stylesheet" href="public/css/style.css">
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- Load the Supabase SDK before the application scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    .auth-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem 1rem;
      background: #0A1628;
    }
    .auth-container {
      width: 100%;
      max-width: 460px;
      padding: 2rem;
      border-radius: 14px;
      background: #1A2D4A;
      color: #fff;
      border: 1px solid rgba(255,215,0,.2);
    }
    .auth-logo, .auth-footer-note, .trust-footer {
      text-align: center;
    }
    .auth-logo h1 { color: #FFD700; }
    .auth-logo h1 span { color: #fff; }
    .auth-logo p, .subtitle { color: #cbd5e1; }
    .auth-tabs { display: flex; margin: 1.5rem 0; }
    .auth-tab {
      flex: 1; padding: .8rem; cursor: pointer;
      border: 1px solid #43536b; background: transparent; color: white;
    }
    .auth-tab.active { color: #FFD700; border-color: #FFD700; }
    .auth-form { display: none; }
    .auth-form.active { display: block; }
    .auth-form h2 { margin-bottom: .4rem; }
    .form-group { margin: 1rem 0; }
    .form-group label { display: block; margin-bottom: .4rem; }
    .form-control {
      width: 100%; box-sizing: border-box; padding: .8rem;
      border: 1px solid #65748b; border-radius: 6px;
    }
    .input-wrapper { position: relative; }
    .input-wrapper .form-control { padding-right: 3rem; }
    .toggle-password {
      position: absolute; right: .7rem; top: 50%;
      transform: translateY(-50%); cursor: pointer;
      border: 0; background: transparent; color: #fff;
    }
    .auth-options {
      display: flex; justify-content: space-between;
      gap: .75rem; flex-wrap: wrap; margin: 1rem 0;
    }
    .terms-check { display: flex; gap: .6rem; margin: 1rem 0; }
    .terms-check a, .forgot-link, .auth-footer-note a { color: #FFD700; }
    .alert {
      display: none; padding: .8rem; margin: 1rem 0;
      border-radius: 6px; overflow-wrap: anywhere;
    }
    .alert.show { display: block; }
    .alert-error { background: #4b2028; color: #ffd5db; }
    .alert-success { background: #173f32; color: #c6ffe4; }
    .alert-info { background: #443b1b; color: #fff0ad; }
    .btn-block { width: 100%; }
    .trust-footer { margin-top: 1.5rem; padding-top: 1rem; }
    .trust-footer .tagline { color: #FFD700; }
    button:disabled { opacity: .65; cursor: wait; }
    @media (max-width: 480px) {
      .auth-container { padding: 1.25rem; }
    }
  </style>
</head>

<body>
  <a href="#main">Skip to main content</a>
  <div id="header-placeholder"></div>

  <main class="auth-page" id="main">
    <section class="auth-container">
      <div class="auth-logo">
        <h1>Genera <span>Tech Hub</span></h1>
        <p>Technology You Can Trust</p>
      </div>

      <div class="auth-tabs" role="tablist">
        <button type="button" class="auth-tab active" id="loginTab"
                role="tab" aria-selected="true">Login</button>
        <button type="button" class="auth-tab" id="signupTab"
                role="tab" aria-selected="false">Sign Up</button>
      </div>

      <div id="systemAlert" class="alert" role="status"></div>

      <section class="auth-form active" id="loginForm">
        <h2>Welcome back</h2>
        <p class="subtitle">Login to your account.</p>
        <div class="alert" id="loginAlert" role="alert"></div>

        <form id="loginFormElement">
          <div class="form-group">
            <label for="loginEmail">Email address</label>
            <input class="form-control" id="loginEmail" type="email"
                   autocomplete="username" required>
          </div>

          <div class="form-group">
            <label for="loginPassword">Password</label>
            <div class="input-wrapper">
              <input class="form-control" id="loginPassword" type="password"
                     autocomplete="current-password" required>
              <button type="button" class="toggle-password"
                      data-target="loginPassword" aria-label="Show password">Show</button>
            </div>
          </div>

          <div class="auth-options">
            <label><input type="checkbox" id="rememberMe"> Remember email</label>
            <a href="#" class="forgot-link" id="forgotPassword">Forgot password?</a>
          </div>

          <button type="submit" class="btn btn-primary btn-block"
                  id="loginSubmitBtn">Login</button>
        </form>

        <p class="auth-footer-note">
          Don't have an account?
          <a href="#signup" id="goSignup">Sign up</a>
        </p>
      </section>

      <section class="auth-form" id="signupForm">
        <h2>Create an account</h2>
        <p class="subtitle">Join Genera Tech Hub.</p>
        <div class="alert" id="signupAlert" role="alert"></div>

        <form id="signupFormElement">
          <div class="form-group">
            <label for="signupName">Full name</label>
            <input class="form-control" id="signupName" required
                   autocomplete="name">
          </div>
          <div class="form-group">
            <label for="signupEmail">Email address</label>
            <input class="form-control" id="signupEmail" type="email"
                   required autocomplete="email">
          </div>
          <div class="form-group">
            <label for="signupPhone">Phone number</label>
            <input class="form-control" id="signupPhone" type="tel"
                   required autocomplete="tel">
          </div>
          <div class="form-group">
            <label for="signupPassword">Password (at least 8 characters)</label>
            <div class="input-wrapper">
              <input class="form-control" id="signupPassword" type="password"
                     minlength="8" autocomplete="new-password" required>
              <button type="button" class="toggle-password"
                      data-target="signupPassword" aria-label="Show password">Show</button>
            </div>
          </div>
          <div class="form-group">
            <label for="signupConfirmPassword">Confirm password</label>
            <input class="form-control" id="signupConfirmPassword"
                   type="password" minlength="8"
                   autocomplete="new-password" required>
          </div>

          <label class="terms-check">
            <input type="checkbox" id="termsCheck" required>
            <span>I agree to the
              <a href="terms.html" target="_blank" rel="noopener">Terms</a>
              and
              <a href="privacy.html" target="_blank" rel="noopener">Privacy Policy</a>.
            </span>
          </label>

          <button type="submit" class="btn btn-primary btn-block"
                  id="signupSubmitBtn">Create Account</button>
        </form>

        <p class="auth-footer-note">
          Already registered? <a href="#login" id="goLogin">Login</a>
        </p>
      </section>

      <div class="trust-footer">
        <div class="tagline">Genera Tech Hub</div>
        <div>Technology You Can Trust</div>
      </div>
    </section>
  </main>

  <div id="footer-placeholder"></div>

  <script>
    // These paths assume login.html is in the repository root.
    fetch("header.html")
      .then(r => {
        if (!r.ok) throw new Error("Header file not found");
        return r.text();
      })
      .then(html => {
        document.getElementById("header-placeholder").innerHTML = html;
      })
      .catch(err => console.warn("Header not loaded:", err.message));

    fetch("footer.html")
      .then(r => {
        if (!r.ok) throw new Error("Footer file not found");
        return r.text();
      })
      .then(html => {
        document.getElementById("footer-placeholder").innerHTML = html;
      })
      .catch(err => console.warn("Footer not loaded:", err.message));
  </script>

  <script src="public/js/supabase.js"></script>
  <script src="public/js/auth.js"></script>

  <script>
    (() => {
      "use strict";

      const $ = id => document.getElementById(id);

      function showAlert(id, message, type = "info") {
        const el = $(id);
        if (!el) return;
        el.textContent = message;
        el.className = "alert alert-" + type + " show";
      }

      function clearAlerts() {
        ["loginAlert", "signupAlert", "systemAlert"].forEach(id => {
          const el = $(id);
          if (el) {
            el.textContent = "";
            el.className = "alert";
          }
        });
      }

      function switchTab(tab) {
        const signup = tab === "signup";
        $("loginTab").classList.toggle("active", !signup);
        $("signupTab").classList.toggle("active", signup);
        $("loginTab").setAttribute("aria-selected", String(!signup));
        $("signupTab").setAttribute("aria-selected", String(signup));
        $("loginForm").classList.toggle("active", !signup);
        $("signupForm").classList.toggle("active", signup);
        clearAlerts();
      }

      function getClient() {
        const client = window.supabaseClient;
        if (!client || !client.auth) {
          throw new Error(
            "Supabase is not initialized. Check the SDK and public/js/supabase.js."
          );
        }
        return client;
      }

      $("loginTab").addEventListener("click", () => switchTab("login"));
      $("signupTab").addEventListener("click", () => switchTab("signup"));
      $("goSignup").addEventListener("click", e => {
        e.preventDefault();
        switchTab("signup");
      });
      $("goLogin").addEventListener("click", e => {
        e.preventDefault();
        switchTab("login");
      });

      document.querySelectorAll(".toggle-password").forEach(button => {
        button.addEventListener("click", () => {
          const input = $(button.dataset.target);
          if (!input) return;
          input.type = input.type === "password" ? "text" : "password";
          button.textContent = input.type === "password" ? "Show" : "Hide";
        });
      });

      $("loginFormElement").addEventListener("submit", async e => {
        e.preventDefault();
        clearAlerts();

        const email = $("loginEmail").value.trim().toLowerCase();
        const password = $("loginPassword").value;
        const button = $("loginSubmitBtn");

        if (!email || !password) {
          return showAlert("loginAlert", "Enter your email and password.", "error");
        }

        const oldText = button.textContent;
        button.disabled = true;
        button.textContent = "Logging in...";

        try {
          const client = getClient();
          const { data, error } = await client.auth.signInWithPassword({
            email, password
          });
          if (error) throw error;

          if ($("rememberMe").checked) {
            localStorage.setItem("gth_remember_email", email);
          } else {
            localStorage.removeItem("gth_remember_email");
          }

          showAlert("loginAlert", "Login successful. Redirecting...", "success");

          // This is a navigation convenience, NOT an authorization check.
          // admin.html must separately verify the authenticated user's role.
          const isCeo = data.user?.email?.toLowerCase() ===
            "mudasirumukthar@gmail.com";

          window.location.assign(isCeo ? "admin.html" : "index.html");
        } catch (error) {
          console.error("Login error:", error);
          showAlert("loginAlert", error.message || "Login failed.", "error");
          button.disabled = false;
          button.textContent = oldText;
        }
      });

      $("signupFormElement").addEventListener("submit", async e => {
        e.preventDefault();
        clearAlerts();

        const fullName = $("signupName").value.trim();
        const email = $("signupEmail").value.trim().toLowerCase();
        const phone = $("signupPhone").value.trim();
        const password = $("signupPassword").value;
        const confirmPassword = $("signupConfirmPassword").value;
        const button = $("signupSubmitBtn");

        if (password.length < 8) {
          return showAlert("signupAlert", "Use at least 8 characters for your password.", "error");
        }
        if (password !== confirmPassword) {
          return showAlert("signupAlert", "Passwords do not match.", "error");
        }
        if (!$("termsCheck").checked) {
          return showAlert("signupAlert", "Please accept the Terms and Privacy Policy.", "error");
        }

        const oldText = button.textContent;
        button.disabled = true;
        button.textContent = "Creating account...";

        try {
          const client = getClient();
          const { data, error } = await client.auth.signUp({
            email,
            password,
            options: {
              emailRedirectTo: window.location.href.split("#")[0],
              data: { full_name: fullName, phone, role: "customer" }
            }
          });

          if (error) throw error;

          showAlert(
            "signupAlert",
            data.session
              ? "Account created. You can now log in."
              : "Account created. Check your email to verify it before logging in.",
            "success"
          );
        } catch (error) {
          console.error("Signup error:", error);
          showAlert("signupAlert", error.message || "Account creation failed.", "error");
        } finally {
          button.disabled = false;
          button.textContent = oldText;
        }
      });

      $("forgotPassword").addEventListener("click", async e => {
        e.preventDefault();
        clearAlerts();

        const email = $("loginEmail").value.trim().toLowerCase();
        if (!email) {
          return showAlert("loginAlert", "Enter your email address first.", "error");
        }

        try {
          const client = getClient();
          const { error } = await client.auth.resetPasswordForEmail(email, {
            redirectTo: window.location.href.split("#")[0]
          });
          if (error) throw error;
          showAlert("loginAlert", "If the account exists, a reset email will be sent.", "success");
        } catch (error) {
          console.error("Password reset error:", error);
          showAlert("loginAlert", error.message || "Could not request password reset.", "error");
        }
      });

      const rememberedEmail = localStorage.getItem("gth_remember_email");
      if (rememberedEmail) {
        $("loginEmail").value = rememberedEmail;
        $("rememberMe").checked = true;
      }

      if (window.location.hash === "#signup") switchTab("signup");

      // Diagnose initialization without endless retry loops.
      window.addEventListener("load", () => {
        if (!window.supabase || typeof window.supabase.createClient !== "function") {
          showAlert("systemAlert",
            "The Supabase SDK did not load. Check your internet connection or CDN request.",
            "error");
          console.error("Supabase SDK unavailable: window.supabase is missing.");
        } else if (!window.supabaseClient) {
          showAlert("systemAlert",
            "Supabase client is not ready. Check the URL and anon/publishable key in public/js/supabase.js.",
            "error");
          console.error("Supabase SDK loaded, but window.supabaseClient is missing.");
        } else {
          console.log("Genera Tech Hub login: Supabase client detected.");
        }
      });
    })();
  </script>
</body>
</html>
